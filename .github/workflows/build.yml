name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Instalar Android SDK si falta
        run: |
          SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          if [ -z "$SDK" ] || [ ! -d "$SDK" ]; then
            case "$(uname -s)" in
              MINGW*|MSYS*|CYGWIN*) PLAT=win; SM=sdkmanager.bat ;;
              Darwin) PLAT=mac; SM=sdkmanager ;;
              *) PLAT=linux; SM=sdkmanager ;;
            esac
            SDK="$HOME/android-sdk"
            if [ ! -d "$SDK/cmdline-tools/latest" ]; then
              mkdir -p "$SDK/cmdline-tools"
              curl -fsSL "https://dl.google.com/android/repository/commandlinetools-${PLAT}-11076708_latest.zip" -o "$HOME/cmdtools.zip"
              unzip -q -o "$HOME/cmdtools.zip" -d "$SDK/cmdline-tools"
              mv "$SDK/cmdline-tools/cmdline-tools" "$SDK/cmdline-tools/latest"
            fi
            if command -v cygpath >/dev/null 2>&1; then SDK_W="$(cygpath -m "$SDK")"; else SDK_W="$SDK"; fi
            yes | "$SDK/cmdline-tools/latest/bin/$SM" --sdk_root="$SDK_W" --licenses > /dev/null || true
            "$SDK/cmdline-tools/latest/bin/$SM" --sdk_root="$SDK_W" "platforms;android-34" "build-tools;34.0.0" "platform-tools"
            echo "sdk.dir=$SDK_W" > local.properties
          else
            if [ -x "$SDK/cmdline-tools/latest/bin/sdkmanager" ]; then
              yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
            fi
          fi

      - name: Compilar APK
        run: |
          mkdir -p "$HOME/gradle-dist"
          curl -fsSL https://services.gradle.org/distributions/gradle-8.5-bin.zip -o "$HOME/gradle.zip"
          unzip -q -o "$HOME/gradle.zip" -d "$HOME/gradle-dist"
          export PATH="$HOME/gradle-dist/gradle-8.5/bin:$PATH"
          gradle --version
          gradle assembleDebug --no-daemon --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: CamarasONVIF-apk
          path: app/build/outputs/apk/debug/*.apk

      - name: Publicar release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="build-${{ github.run_number }}"
          gh release create "$TAG" app/build/outputs/apk/debug/*.apk \
            --title "ONVNIF $TAG" \
            --notes "Build automático del commit ${GITHUB_SHA::7}" \
            --target "$GITHUB_SHA"
